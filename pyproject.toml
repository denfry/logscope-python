[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "logscope-python"
version = "0.1.0"
description = "Bounded log ingestion and Elasticsearch search service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.1",
  "asyncpg==0.30.0",
  "elasticsearch[async]==8.17.0",
  "fastapi==0.115.6",
  "prometheus-client==0.21.1",
  "pydantic-settings==2.7.1",
  "redis==5.2.1",
  "sqlalchemy[asyncio]==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.0",
  "httpx==0.28.1",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "ruff==0.9.2",
  "testcontainers[elasticsearch,postgres]==4.9.0",
]

[project.scripts]
logscope-api = "app.main:run_api"
logscope-worker = "app.main:run_worker"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
  "integration: requires Docker and real PostgreSQL/Elasticsearch services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
